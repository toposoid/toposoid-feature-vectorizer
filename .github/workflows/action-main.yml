name: Build
on:
  push:
    branches:
      - feature
  workflow_dispatch:
env:
  PJ_ACTOR: toposoid
  PJ_REPO: toposoid-scala-lib
  PJ_BRANCH: feature
  PJ_VERSION: 0.7-SNAPSHOT
jobs:
  unit-test_toposoid-feature-vectorizer-amd64:    
    uses: ./.github/workflows/action-check-amd64.yml
    secrets: inherit  
  unit-test_toposoid-feature-vectorizer-arm64:
    uses: ./.github/workflows/action-check-arm64.yml
    secrets: inherit      
  build-preparation:    
    runs-on: ubuntu-24.04
    needs: [unit-test_toposoid-feature-vectorizer-amd64, unit-test_toposoid-feature-vectorizer-arm64]
    steps:
      - name: Clone toposoid-scala-lib
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PJ_ACTOR }}/toposoid-scala-lib          
          ref: ${{ env.PJ_BRANCH }}
  build-toposoid-scala-lib-amd64:
    needs: build-preparation
    uses: toposoid/toposoid-scala-lib/.github/workflows/action-build-push-amd64.yml@feature
    secrets: inherit  
  build-toposoid-scala-lib-arm64:
    needs: build-preparation
    uses: toposoid/toposoid-scala-lib/.github/workflows/action-build-push-arm64.yml@feature
    secrets: inherit  
  merge-and-push-manifest:    
    runs-on: ubuntu-24.04
    needs: [merge-and-push-base-manifest, build-toposoid-scala-lib-amd64, build-toposoid-scala-lib-arm64]
    steps:
      - name: Login to CR
        uses: docker/login-action@v3
        with:
          username: toposoid
          password: ${{ secrets.CR_TOKEN }}
      - name: Marge Push Manifest
        run: |
          docker pull toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-amd64
          docker pull --platform linux/arm64 toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-arm64
          docker manifest create toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }} toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-amd64 toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-arm64          
          docker manifest push toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}